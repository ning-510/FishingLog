<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>漁獲採集日誌</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* 防止 iOS 點擊高亮 */
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        /* 隱藏捲軸但保留功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 圖示組件 (SVG) ---
        const Icon = ({ path, size = 20, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round"
                className={className}
            >
                {path}
            </svg>
        );

        // 修正：使用 <g> (Group) 標籤來包裹多個 SVG 路徑，這是最穩定的 SVG 寫法
        const icons = {
            Calendar: <path d="M19 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM16 2v4M8 2v4M3 10h18" />,
            MapPin: <g><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></g>,
            Waves: <path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>,
            Anchor: <g><circle cx="12" cy="5" r="3"/><line x1="12" y1="22" x2="12" y2="8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></g>,
            DollarSign: <g><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></g>,
            Settings: <g><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></g>,
            Plus: <g><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></g>,
            Trash2: <g><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></g>,
            Save: <g><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></g>,
            History: <g><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/></g>,
            ChevronDown: <polyline points="6 9 12 15 18 9"/>,
            Fish: <g><path d="M6.5 12c.94-2.08 2.38-3.97 4.14-5.38A12.03 12.03 0 0 1 12 6c5.52 0 10 4.48 10 10s-4.48 10-10 10-10-4.48-10-10c0-.17.01-.33.03-.5.5 0 1-.5 1.5-1"/><path d="M17.8 16.37a4 4 0 0 0-2.17-3.17"/><path d="M12.92 14.3a2 2 0 0 0-1.22-1.22"/></g>,
            Navigation: <polygon points="3 11 22 2 13 21 11 13 3 11"/>,
            AlertCircle: <g><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></g>,
            ExternalLink: <g><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></g>,
            FileText: <g><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></g>,
            Camera: <g><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></g>,
            ImageIcon: <g><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></g>,
            Map: <g><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></g>,
            Cloud: <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>,
            CheckCircle: <g><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></g>,
            XCircle: <g><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></g>,
            Loader2: <path d="M21 12a9 9 0 1 1-6.219-8.56" />,
            Users: <g><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g>,
            ShoppingBag: <g><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></g>
        };

        // 簡化呼叫圖示的方法
        const Lucide = (name, props) => {
            return <Icon path={icons[name]} {...props} />;
        };

        // --- 主程式 App ---
        function App() {
            // --- 狀態管理 ---
            const [currentView, setCurrentView] = useState('form');
            
            // 1. 紀錄資料
            const [logs, setLogs] = useState(() => {
                try {
                    const saved = localStorage.getItem('harvestLogs');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });

            // 2. 選項設定
            const [options, setOptions] = useState(() => {
                const defaultOptions = {
                    products: ['石斑', '紅蟳', '文蛤', '牡蠣'],
                    sizes: ['特大', '大', '中', '小', '規格外'],
                    quantities: ['1 簍', '5 斤', '10 斤', '20 斤', '1 隻'],
                    tideTypes: ['大潮', '小潮', '長潮', '若潮'],
                    buyers: ['餐廳', '魚販', '零售', '自用', '盤商']
                };

                try {
                    const saved = localStorage.getItem('harvestOptions');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        return {
                            products: parsed.products || defaultOptions.products,
                            sizes: parsed.sizes || defaultOptions.sizes,
                            quantities: parsed.quantities || defaultOptions.quantities,
                            tideTypes: parsed.tideTypes || defaultOptions.tideTypes,
                            buyers: parsed.buyers || defaultOptions.buyers 
                        };
                    }
                    return defaultOptions;
                } catch (e) {
                    return defaultOptions;
                }
            });

            // Google Script URL
            const [scriptUrl, setScriptUrl] = useState(() => {
                return localStorage.getItem('harvestScriptUrl') || 'https://script.google.com/macros/s/AKfycbxznCVO1QALHtUUJGbK1vYGW6AFieqnxgGqlkPgN6y2ZckSrpXUIEQNuGoGpQ4zlwzJFw/exec';
            });

            // 網址編輯狀態
            const [isEditingUrl, setIsEditingUrl] = useState(false);

            // 表單資料
            const [formData, setFormData] = useState({
                date: new Date().toISOString().split('T')[0],
                location: '',
                tideRegion: '', 
                specificSpot: '', 
                tideType: '大潮',
                relativeHeight: '',
                buyer: '',
                costTransport: '',
                costToll: '',
                costOther: '',
                notes: ''
            });

            // 收穫資料陣列 (固定 5 筆)
            const [harvests, setHarvests] = useState(
                Array(5).fill().map(() => ({ product: '', size: '', quantity: '' }))
            );

            // 照片與其他狀態
            const [photoFile, setPhotoFile] = useState(null);
            const [photoPreview, setPhotoPreview] = useState(null);
            const fileInputRef = useRef(null);

            const [locationStatus, setLocationStatus] = useState('idle'); 
            const [locationError, setLocationError] = useState('');
            const [uploadStatus, setUploadStatus] = useState('idle');

            // --- 效果 (Effects) ---
            useEffect(() => {
                localStorage.setItem('harvestLogs', JSON.stringify(logs));
            }, [logs]);

            useEffect(() => {
                localStorage.setItem('harvestOptions', JSON.stringify(options));
            }, [options]);

            useEffect(() => {
                localStorage.setItem('harvestScriptUrl', scriptUrl);
            }, [scriptUrl]);

            useEffect(() => {
                const buyers = options.buyers || [];
                if (!formData.buyer && buyers.length > 0) {
                    setFormData(prev => ({ ...prev, buyer: buyers[0] }));
                }
            }, [options]);

            // --- 功能函數 ---
            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleHarvestChange = (index, field, value) => {
                const newHarvests = [...harvests];
                newHarvests[index] = { ...newHarvests[index], [field]: value };
                setHarvests(newHarvests);
            };

            const getLocation = () => {
                setLocationStatus('loading');
                setLocationError('');

                if (!navigator.geolocation) {
                    setLocationStatus('error');
                    setLocationError('裝置不支援');
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        const locString = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
                        setFormData(prev => ({ ...prev, location: locString }));
                        setLocationStatus('success');
                    },
                    (error) => {
                        console.error("Geo Error:", error);
                        setLocationStatus('error');
                        let msg = '定位失敗';
                        if(error.code === 1) msg = '權限被拒';
                        else if(error.code === 2) msg = '無法取得位置';
                        else if(error.code === 3) msg = '定位逾時';
                        setLocationError(msg);
                    }
                );
            };

            const openGoogleMaps = () => {
                window.open('https://www.google.com/maps', '_blank');
            };

            const handlePhotoSelect = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setPhotoFile(file);
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setPhotoPreview(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const fileToBase64 = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => {
                        const base64String = reader.result.split(',')[1];
                        resolve({
                            base64: base64String,
                            mimeType: file.type,
                            fileName: file.name
                        });
                    };
                    reader.onerror = error => reject(error);
                });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setUploadStatus('uploading');

                const validHarvests = harvests.filter(h => h.product && h.product.trim() !== '');
                
                const productStr = validHarvests.map(h => h.product).join('\n');
                const sizeStr = validHarvests.map(h => h.size).join('\n');
                const quantityStr = validHarvests.map(h => h.quantity).join('\n');
                
                const mainProduct = validHarvests.length > 0 ? validHarvests[0].product : '未分類';
                const summaryText = validHarvests.length > 1 ? `${mainProduct}等${validHarvests.length}樣` : mainProduct;

                const timestamp = new Date().toLocaleString();
                let cloudSynced = false;

                const newLog = {
                    id: Date.now(),
                    timestamp,
                    ...formData,
                    product: productStr,
                    size: sizeStr,
                    quantity: quantityStr,
                    displaySummary: summaryText,
                    rawHarvests: validHarvests,
                    hasPhoto: !!photoFile,
                    cloudSynced: false
                };

                if (scriptUrl) {
                    try {
                        let imageData = null;
                        if (photoFile) {
                            imageData = await fileToBase64(photoFile);
                        }

                        const payload = {
                            ...newLog,
                            product: productStr || '(無)',
                            size: sizeStr || '-',
                            quantity: quantityStr || '-',
                            notes: `[對象:${formData.buyer}] ${formData.notes}`,
                            imageBase64: imageData ? imageData.base64 : '',
                            imageMimeType: imageData ? imageData.mimeType : '',
                        };

                        await fetch(scriptUrl, {
                            method: 'POST',
                            mode: 'no-cors', 
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        cloudSynced = true;
                        newLog.cloudSynced = true;
                        alert('資料已發送至 Google Sheets！');

                    } catch (error) {
                        console.error("Upload failed:", error);
                        alert('上傳 Google 失敗，僅儲存於本地。');
                    }
                } else {
                    alert('紀錄已儲存！(僅存於手機)');
                }

                setLogs([newLog, ...logs]);
                setUploadStatus('idle');

                setFormData(prev => ({
                    ...prev,
                    costTransport: '',
                    costToll: '',
                    costOther: '',
                    notes: ''
                }));
                setHarvests(Array(5).fill().map(() => ({ product: '', size: '', quantity: '' })));
                setPhotoFile(null);
                setPhotoPreview(null);
                setCurrentView('history');
            };

            const deleteLog = (id) => {
                if (confirm('確定要刪除這筆紀錄嗎？')) {
                    setLogs(logs.filter(log => log.id !== id));
                }
            };

            const addOption = (category, value) => {
                if (!value.trim()) return;
                setOptions(prev => ({
                    ...prev,
                    [category]: [...(prev[category] || []), value]
                }));
            };

            const removeOption = (category, index) => {
                setOptions(prev => ({
                    ...prev,
                    [category]: (prev[category] || []).filter((_, i) => i !== index)
                }));
            };

            const openTideUrl = () => {
                const url = "https://www.cwa.gov.tw/V8/C/M/tide.html";
                const newWindow = window.open(url, '_blank');
                if (!newWindow || newWindow.closed || typeof newWindow.closed === 'undefined') {
                    prompt("瀏覽器封鎖了彈出視窗，請複製以下網址自行開啟：", url);
                }
            };

            // --- 子組件 ---
            const SettingsSection = ({ title, category, iconName }) => {
                const [newValue, setNewValue] = useState('');
                const items = options[category] || [];

                return (
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 mb-4">
                        <div className="flex items-center gap-2 mb-3 text-slate-700 font-semibold">
                            {Lucide(iconName, {size: 18})}
                            <span>{title}設定</span>
                        </div>
                        <div className="flex gap-2 mb-3">
                            <input
                                type="text"
                                value={newValue}
                                onChange={(e) => setNewValue(e.target.value)}
                                placeholder={`新增${title}...`}
                                className="flex-1 border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                            />
                            <button 
                                onClick={() => { addOption(category, newValue); setNewValue(''); }}
                                className="bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700"
                            >
                                {Lucide('Plus', {size: 20})}
                            </button>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            {items.map((item, index) => (
                                <span key={index} className="bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-sm flex items-center gap-2">
                                    {item}
                                    <button onClick={() => removeOption(category, index)} className="text-slate-400 hover:text-red-500 font-bold">
                                        ×
                                    </button>
                                </span>
                            ))}
                        </div>
                    </div>
                );
            };

            // --- Render ---
            return (
                <div className="min-h-screen bg-slate-50 pb-24 font-sans text-slate-800">
                    
                    {/* Header */}
                    <header className="bg-gradient-to-r from-blue-700 to-cyan-600 text-white p-4 shadow-lg sticky top-0 z-50">
                        <div className="flex justify-between items-center max-w-3xl mx-auto">
                            <h1 className="text-xl font-bold flex items-center gap-2">
                                {Lucide('Anchor', {className: "text-cyan-200"})}
                                漁獲採集日誌
                            </h1>
                            <div className="text-xs bg-white/20 px-2 py-1 rounded-full">
                                {new Date().toLocaleDateString()}
                            </div>
                        </div>
                    </header>

                    <main className="max-w-3xl mx-auto p-4">
                        
                        {/* VIEW: 表單輸入 (Form) */}
                        {currentView === 'form' && (
                            <form onSubmit={handleSubmit} className="space-y-6">
                                
                                {/* 1. 日期與地點 */}
                                <section className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="bg-slate-100 px-4 py-2 border-b border-slate-200 flex items-center gap-2 text-slate-600 font-medium">
                                        {Lucide('MapPin', {size: 16})} 基礎資訊
                                    </div>
                                    <div className="p-4 grid gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">日期</label>
                                            <div className="relative">
                                                <input 
                                                    type="date" 
                                                    name="date"
                                                    required
                                                    value={formData.date}
                                                    onChange={handleInputChange}
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 pl-10 focus:ring-2 focus:ring-blue-500 outline-none"
                                                />
                                                <div className="absolute left-3 top-3.5 text-slate-400">{Lucide('Calendar', {size: 18})}</div>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">作業地點</label>
                                            <div className="flex gap-2">
                                                <input 
                                                    type="text" 
                                                    name="location"
                                                    placeholder="手動輸入或點擊定位"
                                                    value={formData.location}
                                                    onChange={handleInputChange}
                                                    className="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
                                                />
                                                <button 
                                                    type="button"
                                                    onClick={getLocation}
                                                    disabled={locationStatus === 'loading'}
                                                    className={`px-3 rounded-xl flex items-center gap-1 transition-colors justify-center ${locationStatus === 'loading' ? 'bg-slate-200 text-slate-500' : 'bg-cyan-600 text-white active:bg-cyan-700'}`}
                                                >
                                                    {locationStatus === 'loading' ? <span className="animate-spin">{Lucide('Loader2', {size:18})}</span> : Lucide('Navigation', {size: 18})}
                                                    <span className="text-sm">定位</span>
                                                </button>
                                                <button 
                                                    type="button"
                                                    onClick={openGoogleMaps}
                                                    className="px-3 rounded-xl bg-slate-200 text-slate-600 active:bg-slate-300 flex items-center gap-1"
                                                    title="開啟 Google Maps 查看位置"
                                                >
                                                    {Lucide('Map', {size: 18})}
                                                </button>
                                            </div>
                                            
                                            {locationStatus === 'success' && (
                                                <p className="text-xs text-green-600 mt-2 flex items-center gap-1 animate-pulse">
                                                    <span className="bg-green-100 p-0.5 rounded-full">✓</span> 定位成功
                                                </p>
                                            )}
                                            {locationStatus === 'error' && (
                                                <div className="mt-2 text-xs">
                                                    <p className="text-red-500 flex items-center gap-1">
                                                        {Lucide('AlertCircle', {size: 14})} {locationError}
                                                    </p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </section>

                                {/* 2. 環境水文 */}
                                <section className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="bg-slate-100 px-4 py-2 border-b border-slate-200 flex items-center gap-2 text-slate-600 font-medium justify-between">
                                        <div className="flex items-center gap-2">
                                            {Lucide('Waves', {size: 16})} 環境水文
                                        </div>
                                        <button 
                                            type="button"
                                            onClick={openTideUrl}
                                            className="text-xs bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg flex items-center gap-1 hover:bg-blue-200 transition-colors active:bg-blue-300"
                                        >
                                            {Lucide('ExternalLink', {size: 14})} 查詢潮汐
                                        </button>
                                    </div>
                                    <div className="p-4 grid grid-cols-2 gap-4">
                                        <div className="col-span-2">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">潮差地區 (大範圍)</label>
                                            <input 
                                                type="text" 
                                                name="tideRegion"
                                                placeholder="例如：鹿港外海、王功"
                                                value={formData.tideRegion}
                                                onChange={handleInputChange}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">大小潮</label>
                                            <div className="relative">
                                                <select 
                                                    name="tideType"
                                                    value={formData.tideType}
                                                    onChange={handleInputChange}
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 appearance-none focus:ring-2 focus:ring-blue-500 outline-none"
                                                >
                                                    {options.tideTypes?.map(o => <option key={o} value={o}>{o}</option>)}
                                                </select>
                                                <div className="absolute right-3 top-4 text-slate-400 pointer-events-none">{Lucide('ChevronDown', {size: 16})}</div>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">相對高度</label>
                                            <input 
                                                type="text" 
                                                name="relativeHeight"
                                                placeholder="例如：+1.5m"
                                                value={formData.relativeHeight}
                                                onChange={handleInputChange}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
                                            />
                                        </div>
                                        <div className="col-span-2">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">潮差地區 (細部地點/地標)</label>
                                            <input 
                                                type="text" 
                                                name="specificSpot"
                                                placeholder="例如：3號蚵棚、北堤旁"
                                                value={formData.specificSpot}
                                                onChange={handleInputChange}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
                                            />
                                        </div>
                                    </div>
                                </section>

                                {/* 3. 收穫成果 */}
                                <section className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden border-l-4 border-l-green-500">
                                    <div className="bg-slate-100 px-4 py-2 border-b border-slate-200 flex items-center justify-between text-slate-600 font-medium">
                                        <div className="flex items-center gap-2">{Lucide('Fish', {size: 16})} 收穫成果 (最多5項)</div>
                                        <span className="text-xs text-slate-400">選項於設定新增</span>
                                    </div>
                                    <div className="p-4 space-y-6">
                                        
                                        {harvests.map((item, index) => (
                                            <div key={index} className="relative bg-slate-50 p-3 rounded-xl border border-slate-200">
                                                <div className="absolute -top-2 -left-2 bg-green-500 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shadow-sm">
                                                    {index + 1}
                                                </div>
                                                
                                                <div className="grid gap-3">
                                                    <div>
                                                        <label className="block text-xs font-bold text-slate-400 mb-1">品名</label>
                                                        <div className="relative">
                                                            <select 
                                                                value={item.product}
                                                                onChange={(e) => handleHarvestChange(index, 'product', e.target.value)}
                                                                className="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 appearance-none focus:ring-2 focus:ring-green-500 outline-none text-slate-700"
                                                            >
                                                                <option value="">(無)</option>
                                                                {options.products?.map(o => <option key={o} value={o}>{o}</option>)}
                                                            </select>
                                                            <div className="absolute right-3 top-3 text-slate-300 pointer-events-none">{Lucide('ChevronDown', {size: 14})}</div>
                                                        </div>
                                                    </div>

                                                    <div className="grid grid-cols-2 gap-3">
                                                        <div>
                                                            <label className="block text-xs font-bold text-slate-400 mb-1">規格</label>
                                                            <div className="relative">
                                                                <select 
                                                                    value={item.size}
                                                                    onChange={(e) => handleHarvestChange(index, 'size', e.target.value)}
                                                                    className="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 appearance-none focus:ring-2 focus:ring-green-500 outline-none text-sm"
                                                                >
                                                                    <option value="">選擇規格</option>
                                                                    {options.sizes?.map(o => <option key={o} value={o}>{o}</option>)}
                                                                </select>
                                                                <div className="absolute right-3 top-3 text-slate-300 pointer-events-none">{Lucide('ChevronDown', {size: 14})}</div>
                                                            </div>
                                                        </div>
                                                        <div>
                                                            <label className="block text-xs font-bold text-slate-400 mb-1">數量</label>
                                                            <div className="relative">
                                                                <select 
                                                                    value={item.quantity}
                                                                    onChange={(e) => handleHarvestChange(index, 'quantity', e.target.value)}
                                                                    className="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 appearance-none focus:ring-2 focus:ring-green-500 outline-none text-sm"
                                                                >
                                                                    <option value="">選擇數量</option>
                                                                    {options.quantities?.map(o => <option key={o} value={o}>{o}</option>)}
                                                                </select>
                                                                <div className="absolute right-3 top-3 text-slate-300 pointer-events-none">{Lucide('ChevronDown', {size: 14})}</div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}

                                        {/* 照片上傳區 */}
                                        <div className="mt-2 border-t border-slate-100 pt-4">
                                            <label className="block text-xs font-bold text-slate-500 mb-2">現場照片 (將上傳至 Drive)</label>
                                            
                                            <input 
                                                type="file" 
                                                accept="image/*" 
                                                capture="environment" 
                                                ref={fileInputRef}
                                                onChange={handlePhotoSelect}
                                                className="hidden" 
                                            />

                                            {!photoPreview ? (
                                                <button 
                                                    type="button"
                                                    onClick={() => fileInputRef.current?.click()}
                                                    className="w-full border-2 border-dashed border-slate-300 rounded-xl p-6 flex flex-col items-center justify-center text-slate-400 hover:bg-slate-50 hover:border-blue-400 hover:text-blue-500 transition-colors gap-2"
                                                >
                                                    {Lucide('Camera', {size: 32})}
                                                    <span className="text-sm font-medium">拍攝 / 選擇照片</span>
                                                </button>
                                            ) : (
                                                <div className="relative rounded-xl overflow-hidden border border-slate-200">
                                                    <img src={photoPreview} alt="Preview" className="w-full h-48 object-cover" />
                                                    <button 
                                                        type="button"
                                                        onClick={() => { setPhotoFile(null); setPhotoPreview(null); }}
                                                        className="absolute top-2 right-2 bg-red-500 text-white p-1 rounded-full shadow-lg"
                                                    >
                                                        {Lucide('Trash2', {size: 14})}
                                                    </button>
                                                </div>
                                            )}
                                            {scriptUrl ? (
                                                <p className="text-[10px] text-green-600 mt-2 text-center flex items-center justify-center gap-1">
                                                    {Lucide('CheckCircle', {size: 10})} 將於儲存時自動上傳至 Google Drive
                                                </p>
                                            ) : (
                                                <p className="text-[10px] text-red-400 mt-2 text-center flex items-center justify-center gap-1">
                                                    {Lucide('AlertCircle', {size: 10})} 未設定雲端網址，照片僅供預覽不會上傳
                                                </p>
                                            )}
                                        </div>

                                    </div>
                                </section>

                                {/* 4. 出貨對象 & 成本 */}
                                <section className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden border-l-4 border-l-orange-400">
                                    <div className="bg-slate-100 px-4 py-2 border-b border-slate-200 flex items-center gap-2 text-slate-600 font-medium">
                                        {Lucide('ShoppingBag', {size: 16})} 銷售與成本
                                    </div>
                                    <div className="p-4 space-y-4">
                                        
                                        {/* 出貨對象 */}
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1 flex items-center gap-1">
                                                {Lucide('Users', {size: 12})} 出貨對象
                                            </label>
                                            <div className="relative">
                                                <select 
                                                    name="buyer"
                                                    value={formData.buyer}
                                                    onChange={handleInputChange}
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 appearance-none focus:ring-2 focus:ring-orange-400 outline-none font-medium text-slate-700"
                                                >
                                                    <option value="" disabled>請選擇對象</option>
                                                    {options.buyers?.map(o => <option key={o} value={o}>{o}</option>)}
                                                </select>
                                                <div className="absolute right-3 top-4 text-slate-400 pointer-events-none">{Lucide('ChevronDown', {size: 16})}</div>
                                            </div>
                                        </div>

                                        <div className="border-t border-slate-100 my-2"></div>

                                        <div className="grid grid-cols-3 gap-3">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 mb-1">車資(油錢)</label>
                                                <input 
                                                    type="number" 
                                                    name="costTransport"
                                                    placeholder="0"
                                                    value={formData.costTransport}
                                                    onChange={handleInputChange}
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-right focus:ring-2 focus:ring-red-400 outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 mb-1">過路費</label>
                                                <input 
                                                    type="number" 
                                                    name="costToll"
                                                    placeholder="0"
                                                    value={formData.costToll}
                                                    onChange={handleInputChange}
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-right focus:ring-2 focus:ring-red-400 outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 mb-1">其他</label>
                                                <input 
                                                    type="number" 
                                                    name="costOther"
                                                    placeholder="0"
                                                    value={formData.costOther}
                                                    onChange={handleInputChange}
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-right focus:ring-2 focus:ring-red-400 outline-none"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                </section>

                                {/* 5. 備註 */}
                                <section className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="bg-slate-100 px-4 py-2 border-b border-slate-200 flex items-center gap-2 text-slate-600 font-medium">
                                        {Lucide('FileText', {size: 16})} 備註
                                    </div>
                                    <div className="p-4">
                                        <textarea
                                            name="notes"
                                            placeholder="輸入其他備註事項..."
                                            value={formData.notes}
                                            onChange={handleInputChange}
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 focus:ring-2 focus:ring-blue-500 outline-none h-24 resize-none"
                                        />
                                    </div>
                                </section>

                                <button 
                                    type="submit" 
                                    disabled={uploadStatus === 'uploading'}
                                    className={`w-full text-white font-bold py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 text-lg ${uploadStatus === 'uploading' ? 'bg-slate-400' : 'bg-blue-600 hover:bg-blue-700 active:scale-95 shadow-blue-200'}`}
                                >
                                    {uploadStatus === 'uploading' ? (
                                        <React.Fragment>
                                            <span className="animate-spin">{Lucide('Loader2', {size: 24})}</span>
                                            上傳資料中...
                                        </React.Fragment>
                                    ) : (
                                        <React.Fragment>
                                            {Lucide('Save', {size: 24})}
                                            儲存紀錄 {scriptUrl && '& 同步雲端'}
                                        </React.Fragment>
                                    )}
                                </button>
                                <div className="h-4"></div>
                            </form>
                        )}

                        {/* VIEW: 設定 (Settings) */}
                        {currentView === 'settings' && (
                            <div className="animate-fade-in">
                                <h2 className="text-xl font-bold mb-4 text-slate-700">選單設定</h2>
                                
                                <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 mb-6 border-l-4 border-l-blue-500">
                                    <div className="flex items-center gap-2 mb-2 text-blue-800 font-bold">
                                        {Lucide('Cloud', {size: 18})}
                                        <span>雲端同步設定 (Google Sheets)</span>
                                    </div>
                                    <p className="text-xs text-slate-500 mb-3">
                                        請輸入您的「Apps Script 網頁應用程式網址」以啟用自動上傳。
                                    </p>
                                    <div className="flex gap-2">
                                        <input 
                                            type="text" 
                                            placeholder="https://script.google.com/macros/s/..."
                                            value={scriptUrl}
                                            onChange={(e) => setScriptUrl(e.target.value)}
                                            disabled={!isEditingUrl}
                                            className={`flex-1 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none ${!isEditingUrl ? 'text-slate-500 bg-slate-100' : ''}`}
                                        />
                                        {isEditingUrl ? (
                                            <button 
                                                onClick={() => { setIsEditingUrl(false); alert('網址已儲存！'); }}
                                                className="bg-green-600 text-white px-4 rounded-lg text-sm hover:bg-green-700 whitespace-nowrap"
                                            >
                                                確認
                                            </button>
                                        ) : (
                                            <button 
                                                onClick={() => setIsEditingUrl(true)}
                                                className="bg-blue-600 text-white px-4 rounded-lg text-sm hover:bg-blue-700 whitespace-nowrap"
                                            >
                                                修改
                                            </button>
                                        )}
                                    </div>
                                </div>

                                <SettingsSection title="產品 (品名)" category="products" iconName="Fish" />
                                <SettingsSection title="規格 (大小)" category="sizes" iconName="Waves" />
                                <SettingsSection title="數量 (單位)" category="quantities" iconName="Anchor" />
                                <SettingsSection title="潮汐種類" category="tideTypes" iconName="Waves" />
                                <SettingsSection title="出貨對象" category="buyers" iconName="Users" />
                            </div>
                        )}

                        {/* VIEW: 歷史紀錄 (History) */}
                        {currentView === 'history' && (
                            <div className="space-y-4 animate-fade-in">
                                <h2 className="text-xl font-bold mb-4 text-slate-700 flex justify-between items-center">
                                    <span>歷史紀錄 ({logs.length})</span>
                                    <button onClick={() => {if(confirm('清除所有紀錄?')) setLogs([])}} className="text-xs text-red-400 font-normal">清除全部</button>
                                </h2>
                                
                                {logs.length === 0 ? (
                                    <div className="text-center py-10 text-slate-400">
                                        <div className="mx-auto mb-2 opacity-50 flex justify-center">{Lucide('History', {size: 48})}</div>
                                        <p>尚無紀錄</p>
                                    </div>
                                ) : (
                                    logs.map(log => {
                                        const totalCost = Number(log.costTransport || 0) + Number(log.costToll || 0) + Number(log.costOther || 0);
                                        return (
                                            <div key={log.id} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 relative group">
                                                <button 
                                                    onClick={() => deleteLog(log.id)}
                                                    className="absolute top-4 right-4 text-slate-300 hover:text-red-500"
                                                >
                                                    {Lucide('Trash2', {size: 18})}
                                                </button>

                                                <div className="flex items-baseline justify-between mb-2 pr-8">
                                                    <h3 className="text-lg font-bold text-blue-800">{log.displaySummary || log.product}</h3>
                                                    <span className="text-sm font-medium text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">{log.date}</span>
                                                </div>
                                                
                                                <div className="mb-3">
                                                    {log.cloudSynced ? (
                                                        <span className="inline-flex items-center gap-1 text-[10px] bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded border border-blue-100">
                                                            {Lucide('CheckCircle', {size: 10})} 已同步雲端
                                                        </span>
                                                    ) : (
                                                        <span className="inline-flex items-center gap-1 text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">
                                                            {Lucide('XCircle', {size: 10})} 僅存本地
                                                        </span>
                                                    )}
                                                </div>

                                                {/* 顯示詳細收穫清單 */}
                                                <div className="bg-slate-50 p-2 rounded-lg mb-3 text-sm text-slate-600 space-y-1">
                                                    {log.rawHarvests && log.rawHarvests.length > 0 ? (
                                                        log.rawHarvests.map((h, idx) => (
                                                            <div key={idx} className="flex justify-between border-b border-slate-100 last:border-0 pb-1 last:pb-0">
                                                                <span className="font-medium">{h.product}</span>
                                                                <span className="text-slate-500">{h.size} / {h.quantity}</span>
                                                            </div>
                                                        ))
                                                    ) : (
                                                        <div className="flex justify-between">
                                                            <span className="font-medium">{log.product}</span>
                                                            <span className="text-slate-500">{log.size} / {log.quantity}</span>
                                                        </div>
                                                    )}
                                                </div>

                                                <div className="grid grid-cols-2 gap-y-2 text-sm text-slate-600 mb-3">
                                                    <div><span className="text-slate-400 text-xs">對象:</span> {log.buyer || '(未填)'}</div>
                                                    <div><span className="text-slate-400 text-xs">地點:</span> {log.tideRegion}</div>
                                                    <div><span className="text-slate-400 text-xs">細部:</span> {log.specificSpot}</div>
                                                    <div><span className="text-slate-400 text-xs">潮汐:</span> {log.tideType}</div>
                                                </div>
                                                
                                                {log.hasPhoto && (
                                                    <div className="mb-2 inline-flex items-center gap-1 text-xs bg-green-50 text-green-700 px-2 py-1 rounded-full">
                                                        {Lucide('ImageIcon', {size: 12})} 有照片
                                                    </div>
                                                )}

                                                {log.notes && (
                                                    <div className="border-t border-slate-100 pt-2 mt-2 text-sm text-slate-500">
                                                        <span className="text-xs text-slate-400 block mb-1">備註:</span>
                                                        {log.notes}
                                                    </div>
                                                )}

                                                {totalCost > 0 && (
                                                    <div className="border-t border-slate-100 pt-2 mt-2 flex justify-between items-center text-sm">
                                                        <span className="text-slate-400">總成本</span>
                                                        <span className="font-bold text-red-500 flex items-center">
                                                            {Lucide('DollarSign', {size: 14})} {totalCost}
                                                        </span>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        )}

                    </main>

                    {/* 底部導航列 */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 pb-safe-area shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
                        <div className="max-w-3xl mx-auto flex justify-around p-2">
                            <button 
                                onClick={() => setCurrentView('form')}
                                className={`p-3 rounded-xl flex flex-col items-center gap-1 text-xs font-medium transition-colors w-20 ${currentView === 'form' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:text-slate-600'}`}
                            >
                                {Lucide('Plus', {size: 24})}
                                <span>記一筆</span>
                            </button>
                            
                            <button 
                                onClick={() => setCurrentView('history')}
                                className={`p-3 rounded-xl flex flex-col items-center gap-1 text-xs font-medium transition-colors w-20 ${currentView === 'history' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:text-slate-600'}`}
                            >
                                {Lucide('History', {size: 24})}
                                <span>紀錄</span>
                            </button>

                            <button 
                                onClick={() => setCurrentView('settings')}
                                className={`p-3 rounded-xl flex flex-col items-center gap-1 text-xs font-medium transition-colors w-20 ${currentView === 'settings' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:text-slate-600'}`}
                            >
                                {Lucide('Settings', {size: 24})}
                                <span>設定</span>
                            </button>
                        </div>
                    </nav>

                    <div className="pb-6"></div> 
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
